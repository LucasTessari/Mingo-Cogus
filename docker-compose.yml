services:
  db:
    image: postgres:17-alpine
    container_name: mingo-db
    environment:
      POSTGRES_USER: mingo
      POSTGRES_PASSWORD: mingo
      POSTGRES_DB: mingo
    # 5433 evita conflito com um Postgres instalado nativamente no Windows
    ports:
      - '5433:5432'
    volumes:
      - mingo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mingo -d mingo']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  mingo_pgdata: {}
